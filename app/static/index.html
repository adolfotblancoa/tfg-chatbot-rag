<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Chatbot RAG CEU</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    #chat {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      height: 400px;
      overflow-y: auto;
      background: #fafafa;
      margin-bottom: 15px;
    }

    .message {
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .user {
      text-align: right;
    }

    .bot {
      text-align: left;
    }

    .bubble {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 14px;
      max-width: 80%;
    }

    .user .bubble {
      background: #d9eaff;
    }

    .bot .bubble {
      background: #eeeeee;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #003366;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .meta {
      font-size: 12px;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chatbot RAG CEU</h1>
    <div class="subtitle">Demo web del asistente conversacional institucional</div>

    <div id="chat"></div>

    <div class="input-row">
      <input id="messageInput" type="text" placeholder="Escribe tu pregunta..." />
      <button id="sendButton" onclick="sendMessage()">Enviar</button>
    </div>

    <div class="meta" id="sessionInfo"></div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const sessionInfo = document.getElementById("sessionInfo");

    let userIdentifier = localStorage.getItem("user_identifier");

    if (!userIdentifier) {
      userIdentifier = "web-" + crypto.randomUUID();
      localStorage.setItem("user_identifier", userIdentifier);
    }

    sessionInfo.textContent = "Usuario demo: " + userIdentifier;

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.className = "message " + sender;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      msg.appendChild(bubble);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      button.disabled = true;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            user_identifier: userIdentifier,
            channel: "web",
            message: message
          })
        });

        const data = await response.json();

        if (data.reply) {
          addMessage(data.reply, "bot");
          sessionInfo.textContent = "Usuario demo: " + userIdentifier + " | Sesión: " + data.session_id;
        } else {
          addMessage("No se recibió respuesta del servidor.", "bot");
        }
      } catch (error) {
        addMessage("Error al conectar con el servidor.", "bot");
      } finally {
        button.disabled = false;
        input.focus();
      }
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
